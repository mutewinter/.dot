# Near-default Herdr config. Only the handful of ../home/.tmux.conf chords that
# are already muscle memory are ported; everything else stays on Herdr's own
# defaults, which `herdr --default-config` prints in full.

[keys]
# `bind h split-window -v`. This is Herdr's focus_pane_left by default, given up
# because the hjkl pane focus goes unused here. prefix+j/k/l still focus.
split_horizontal = ["prefix+h", "prefix+minus"]

# tmux detaches on prefix+d; Herdr's own default is prefix+q.
detach = ["prefix+d", "prefix+q"]

# Prefixless pane focus, matching how tmux's `bind -n` chords felt. alt+h and
# alt+l shadow fish's man-page and list-token bindings, which ../home/.tmux.conf
# already shadowed inside tmux. prefix+j/k/l keep working alongside.
focus_pane_left = "alt+h"
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# `bind -nr M-o resize-pane -Z`. Needs macos-option-as-alt in ../ghostty/config,
# and reaches Herdr only when it is not running inside tmux, which binds M-o.
zoom = ["prefix+z", "alt+o"]

# `bind -n M-i choose-tree`. Navigate mode is the closest equivalent: it walks
# workspaces and panes, with the same tmux caveats as alt+o above.
goto = ["prefix+g", "alt+i"]

[theme]
# Inherit the outer terminal's palette so panes match the jellybeans colors
# in ../ghostty/config rather than shipping a second palette.
name = "terminal"

[theme.custom]
accent = "#97bedc"

[ui]
# One agent per tab is the layout here, so a name prompt on every prefix+c is
# friction. Tabs fall back to generated numbers, and the agent rows below carry
# Claude's own session title anyway.
prompt_new_tab_name = false

# Only the zoom flag sits at the right edge of the tab bar. The clock and
# hostname went back to the tabs, which need the width more than a second copy
# of what the menu bar already shows.
tab_bar_right = [{ type = "zoom" }]

# Claude Code and Codex both write a session summary to the terminal title, so
# it leads the row and the space follows it. The tab token is left out because
# prompt_new_tab_name above generates bare numbers, which read like a shortcut
# and are not one. Herdr drops a row whose tokens all resolve to nothing, so an
# agent that sets no title costs no height.
#
# Herdr styles by token kind rather than by row, so the title arrives dim and the
# space bold; the inline styles swap that emphasis. Foreground colors stay
# unset so the terminal palette above still supplies them.
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true, dim = false }],
  [{ token = "workspace", bold = false, dim = true }, "agent"],
]

# Too many agents run here for either chime to mean anything: completions land
# constantly, and any background agent hitting a permission prompt rings the
# needs-input one. Herdr has only these two sounds and no per-notification
# toggle, so a silent file stands in for both, and deleting a line brings that
# one back. Relative paths resolve from ~/.config/herdr, which ../install.sh
# points at ./sounds.
[ui.sound]
done_path = "sounds/silence.mp3"
request_path = "sounds/silence.mp3"
