# Near-default Herdr config. Only the handful of ../home/.tmux.conf chords that
# are already muscle memory are ported; everything else stays on Herdr's own
# defaults, which `herdr --default-config` prints in full.

[keys]
# `bind h split-window -v`. This is Herdr's focus_pane_left by default, given up
# because the hjkl pane focus goes unused here. prefix+j/k/l still focus.
split_horizontal = ["prefix+h", "prefix+minus"]

# tmux detaches on prefix+d; Herdr's own default is prefix+q.
detach = ["prefix+d", "prefix+q"]

# Prefixless pane focus, matching how tmux's `bind -n` chords felt. alt+h and
# alt+l shadow fish's man-page and list-token bindings, which ../home/.tmux.conf
# already shadowed inside tmux. prefix+j/k/l keep working alongside.
focus_pane_left = "alt+h"
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# `bind -nr M-o resize-pane -Z`. Needs macos-option-as-alt in ../ghostty/config,
# and reaches Herdr only when it is not running inside tmux, which binds M-o.
zoom = ["prefix+z", "alt+o"]

# `bind -n M-i choose-tree`. Navigate mode is the closest equivalent: it walks
# workspaces and panes, with the same tmux caveats as alt+o above.
goto = ["prefix+g", "alt+i"]

[theme]
# Inherit the outer terminal's palette so panes match the jellybeans colors
# in ../ghostty/config rather than shipping a second palette.
name = "terminal"

[theme.custom]
accent = "#97bedc"

[ui]
# Zoom flag, date, 12-hour clock, and hostname at the right edge of the tab bar.
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%Y-%m-%d %l:%M%p" },
  { type = "hostname" },
]
tab_bar_right_separator = "  "

# Claude Code writes its own session summary to the terminal title, so the agent
# rows show it. Every other agent keeps the two-row default.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]
