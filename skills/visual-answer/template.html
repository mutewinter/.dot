<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Placeholder only. The real tab title is derived from the h1 by the
         script at the end of the body, so the two cannot drift apart. -->
    <title>Visual answer</title>
    <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg/%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
      rel="stylesheet"
      type="text/css"
    />
    <style type="text/tailwindcss">
      @import "tailwindcss";

      /* Studio's light theme, resolved from
         apps/studio/src/client/styles/globals.css. Regenerate with the command
         in SKILL.md rather than editing by hand.

         `static` matters: without it Tailwind emits only the variables some
         utility class on the page uses, so a var(--color-…) in generated SVG
         can silently resolve to nothing and the fill falls back to black. */
      @theme static {
        /* sync:start */
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, monospace;

        --radius: 0.5rem;
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);

        --shadow-sm: 0 2px 4px 0 rgb(10 13 18 / 0.04), 0 1px 2px -1px rgb(10 13 18 / 0.06), 0 0 0 1px rgb(10 13 18 / 0.06);
        --shadow-xl: 0 12px 24px -4px rgb(10 13 18 / 0.07), 0 6px 10px -6px rgb(10 13 18 / 0.07), 0 0 0 1px rgb(10 13 18 / 0.06);

        --color-gray-25: #fdfdfc;
        --color-gray-50: #fafaf9;
        --color-gray-100: #f5f5f4;
        --color-gray-200: #e7e5e4;
        --color-gray-300: #d7d3d0;
        --color-gray-400: #a9a29d;
        --color-gray-500: #79716b;
        --color-gray-600: #57534e;
        --color-gray-700: #44403c;
        --color-gray-800: #292524;
        --color-gray-900: #1c1917;
        --color-gray-950: #171412;

        --color-brand-25: #f1f4f2;
        --color-brand-50: #e2eae7;
        --color-brand-100: #c5d5d0;
        --color-brand-200: #9dbfb6;
        --color-brand-300: #6ca89c;
        --color-brand-400: #338c81;
        --color-brand-500: #0e7869;
        --color-brand-600: #0b6056;
        --color-brand-700: #0a4a42;
        --color-brand-800: #093a34;
        --color-brand-900: #082c28;
        --color-brand-950: #051b18;

        --color-error-50: #fbeef0;
        --color-error-100: #f8e4e8;
        --color-error-300: #e197a6;
        --color-error-500: #b4324f;
        --color-error-700: #7a1f30;
        --color-error-900: #3f121a;

        --color-warning-50: #fffaeb;
        --color-warning-100: #fef0c7;
        --color-warning-300: #fec84b;
        --color-warning-500: #f79009;
        --color-warning-700: #b54708;
        --color-warning-900: #7a2e0e;

        --color-success-50: #e9f5eb;
        --color-success-100: #d9f1db;
        --color-success-300: #7dcb87;
        --color-success-500: #29a845;
        --color-success-700: #176229;
        --color-success-900: #0b3216;

        --color-yellow-50: #fdf6e2;
        --color-yellow-100: #fbebc9;
        --color-yellow-300: #f1cc8e;
        --color-yellow-500: #d58f4f;
        --color-yellow-700: #b26747;
        --color-yellow-900: #59301e;

        --color-brown-50: #fcfbf8;
        --color-brown-100: #f6f4f0;
        --color-brown-300: #e8e3da;
        --color-brown-500: #bbaa8e;
        --color-brown-700: #937b5b;
        --color-brown-900: #564538;

        --color-background: #fafaf9;
        --color-foreground: #171412;
        --color-card: #ffffff;
        --color-popover: #ffffff;
        --color-primary: #171412;
        --color-primary-foreground: #ffffff;
        --color-secondary: #f5f5f4;
        --color-secondary-foreground: #292524;
        --color-muted: #f5f5f4;
        --color-muted-foreground: #79716b;
        --color-accent: #e7e5e4;
        --color-accent-foreground: #292524;
        --color-destructive: #b4324f;
        --color-border: #e7e5e4;
        --color-input: #e7e5e4;
        --color-ring: #a9a29d;
        /* sync:end */
      }
    </style>
    <style>
      /* The strip scrolls itself, and a scrollbar flashing in and out over the
         top of the page while you read is pure distraction. Fades stand in for
         it, and only when there is actually more strip than fits. */
      [data-strip] {
        scrollbar-width: none;
        -ms-overflow-style: none;
        overflow-y: hidden;
      }
      [data-strip]::-webkit-scrollbar {
        display: none;
      }
      [data-strip][data-overflow="both"] {
        mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
      }
      [data-strip][data-overflow="end"] {
        mask-image: linear-gradient(90deg, #000 calc(100% - 20px), transparent 100%);
      }
      [data-strip][data-overflow="start"] {
        mask-image: linear-gradient(90deg, transparent 0, #000 20px);
      }
    </style>
    <style>
      /* Two ways out of main's column, for the blocks that need more room
         than a measure meant for sentences. `wide` is the everyday one: a
         dense table, a matrix, a comparison whose columns are being squeezed.
         `full` is for content that is the argument rather than illustrating
         it. Both center on the column, so the prose around them keeps its
         measure and the page still reads as one document.

         92vw rather than 100vw keeps a margin and avoids the horizontal
         scrollbar a full-viewport child causes on Windows. Both are capped:
         past its cap a row stops reading as one thing. */
      [data-width="wide"],
      [data-width="full"] {
        position: relative;
        left: 50%;
        translate: -50%;
      }
      [data-width="wide"] {
        width: min(76rem, 92vw);
      }
      [data-width="full"] {
        width: min(132rem, 92vw);
      }
    </style>
    <style>
      @media print {
        * {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
      }
    </style>
    <style>
      /* highlight.js token colors on the dark code surface, matched to the
         theme. The script at the end of the body loads highlight.js only when
         a pre > code block exists. */
      pre code.hljs {
        background: transparent;
        padding: 0;
        color: var(--color-gray-100); /* code excerpts sit on the dark surface */
      }
      .hljs-comment, .hljs-quote { color: var(--color-gray-400); }
      .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-built_in, .hljs-type { color: var(--color-brand-300); }
      .hljs-string, .hljs-addition, .hljs-regexp { color: var(--color-success-300); }
      .hljs-number, .hljs-attr, .hljs-attribute, .hljs-symbol, .hljs-meta { color: var(--color-warning-300); }
      .hljs-title, .hljs-name, .hljs-section, .hljs-selector-id, .hljs-selector-class { color: var(--color-gray-100); }
      .hljs-deletion { color: var(--color-error-300); }
      .hljs-variable, .hljs-template-variable, .hljs-bullet { color: var(--color-gray-200); }
    </style>
    <style>
      /* Code and terminal blocks wrap by default: these pages are read at
         whatever width the window happens to be, and a line that runs off the
         right edge is a line nobody reads. The script at the end of the body
         attaches a Copy button and a Wrap toggle to every <pre>, so no page
         has to build its own. The toggle returns one block to one line per
         line, for output whose columns carry meaning; `<pre data-wrap="off">`
         starts a block that way, which is what an ASCII diagram wants. */
      main pre {
        white-space: pre-wrap;
        overflow-wrap: break-word;
        overflow-x: auto;
        /* Never vertically, or the wheel gets spent here. A horizontal
           scrollbar steals height from the content box, which leaves the
           block scrollable down by exactly the scrollbar's height, and a
           reader scrolling past it stops instead. Only bites with a mouse
           attached, since overlay scrollbars take no space. */
        overflow-y: hidden;
      }
      main [data-wrap="off"] pre,
      main pre[data-wrap="off"] {
        white-space: pre;
        overflow-wrap: normal;
      }
      [data-code-block] {
        position: relative;
      }
      [data-code-tools] {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        display: flex;
        gap: 0.25rem;
        opacity: 0;
        transition: opacity 120ms ease;
      }
      [data-code-block]:hover > [data-code-tools],
      [data-code-block]:focus-within > [data-code-tools] {
        opacity: 1;
      }
      @media (hover: none) {
        [data-code-tools] {
          opacity: 1;
        }
      }
      [data-code-tools] button {
        display: inline-flex;
        align-items: center;
        gap: 0.3em;
        cursor: pointer;
        border: 1px solid rgb(255 255 255 / 0.14);
        border-radius: var(--radius-sm);
        background: rgb(255 255 255 / 0.08);
        padding: 0.2rem 0.45rem;
        font-family: var(--font-sans);
        font-size: 0.6875rem;
        font-weight: 500;
        line-height: 1.4;
        color: var(--color-gray-300);
        backdrop-filter: blur(4px);
      }
      [data-code-tools] button:hover,
      [data-code-tools] button[aria-pressed="true"] {
        background: rgb(255 255 255 / 0.18);
        color: var(--color-gray-50);
      }
      [data-code-block][data-surface="light"] [data-code-tools] button {
        border-color: var(--color-border);
        background: rgb(255 255 255 / 0.85);
        color: var(--color-gray-600);
      }
      [data-code-block][data-surface="light"] [data-code-tools] button:hover,
      [data-code-block][data-surface="light"] [data-code-tools] button[aria-pressed="true"] {
        background: var(--color-gray-100);
        color: var(--color-gray-900);
      }
      @media print {
        [data-code-tools] {
          display: none;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-background font-sans text-foreground antialiased">
    <main class="mx-auto max-w-4xl px-5 py-10 sm:px-8 sm:py-14">
      <header class="max-w-3xl">
        <p class="mb-3 text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          Visual answer
        </p>
        <h1 class="text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">TITLE</h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">THESIS</p>
      </header>

      <!-- Replace this scaffold with the visual structure the question needs. -->
      <section class="mt-10 rounded-xl border border-border bg-card p-6 shadow-sm">
        <p class="text-sm text-muted-foreground">Build the explanation here.</p>
      </section>
    </main>

    <!-- The h1 leads the tab title: browsers truncate from the end, and a
         shared prefix would render every open explanation identical. -->
    <script>
      const heading = document.querySelector("h1");
      if (heading) {
        document.title = `${heading.textContent.trim()} · Visual answer`;
      }

      // Stacked bars on near-black. The shortest bar takes a color derived
      // from data-thread, so several pages from one conversation are the same
      // color in a row of open tabs, and a different conversation is not.
      const thread = document.querySelector("[data-thread]")?.dataset.thread ?? "";
      let hue = 0;
      for (const ch of thread) hue = (hue * 31 + ch.charCodeAt(0)) % 360;
      const accent = thread ? `hsl(${hue} 58% 45%)` : "#ffffff";
      const accentOpacity = thread ? "1" : "0.5";
      document.querySelector("#favicon").href =
        "data:image/svg+xml," +
        encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#171412"/><rect x="7" y="9" width="18" height="3.5" rx="1.75" fill="#ffffff"/><rect x="7" y="15" width="13" height="3.5" rx="1.75" fill="#ffffff" opacity="0.75"/><rect x="7" y="21" width="8" height="3.5" rx="1.75" fill="${accent}" opacity="${accentOpacity}"/></svg>`,
        );

      // Orientation strip, built from main > section[id] h2s and shown at
      // every width: the document title, then the section names with the
      // current one marked by darker weight and a quiet underline. It
      // occupies the very top of the page from load and sticks without
      // moving or resizing.
      const tocSections = [...document.querySelectorAll("main section[id]")].filter((s) => s.querySelector("h2"));
      if (tocSections.length >= 4) {
        const escToc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/'/g, "&#39;");
        const tocStrip = document.createElement("nav");
        tocStrip.setAttribute("aria-label", "Sections");
        tocStrip.className = "sticky top-0 z-20 border-b border-border bg-background/95 backdrop-blur print:hidden";
        tocStrip.innerHTML =
          "<div class='mx-auto flex max-w-4xl items-center gap-x-3 px-5 text-xs sm:px-8'>" +
          "<span class='max-w-48 shrink-0 truncate py-2 font-semibold text-foreground'>" + escToc(heading ? heading.textContent.trim() : "") + "</span>" +
          "<span class='h-4 w-px shrink-0 bg-border'></span>" +
          "<div data-strip class='flex gap-x-4 overflow-x-auto whitespace-nowrap'>" +
          tocSections
            .map((s) => {
              const h = s.querySelector("h2");
              const label = escToc(h.dataset.short || h.textContent.trim());
              return "<a href='#" + s.id + "' data-spy='" + s.id + "' class='shrink-0 border-b-2 border-transparent py-2 text-gray-600 hover:text-foreground'>" + label + "</a>";
            })
            .join("") +
          "</div></div>";
        document.body.prepend(tocStrip);

        const strip = tocStrip.querySelector("[data-strip]");
        const markEdges = () => {
          const more = strip.scrollWidth - strip.clientWidth;
          const atStart = strip.scrollLeft < 4;
          const atEnd = strip.scrollLeft > more - 4;
          strip.dataset.overflow = more < 4 ? "none" : atStart ? "end" : atEnd ? "start" : "both";
        };
        strip.addEventListener("scroll", markEdges, { passive: true });
        addEventListener("resize", markEdges);
        markEdges();

        const markSpy = (id) => {
          document.querySelectorAll("a[data-spy]").forEach((a) => {
            const on = a.dataset.spy === id;
            a.classList.toggle("border-foreground", on);
            a.classList.toggle("border-transparent", !on);
            a.classList.toggle("text-foreground", on);
            a.classList.toggle("font-semibold", on);
            a.classList.toggle("text-gray-600", !on);
            if (on) {
              const c = a.closest("[data-strip]");
              c.scrollTo({ left: a.offsetLeft - c.offsetLeft - c.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
            }
          });
        };
        const spy = new IntersectionObserver(
          (entries) => entries.forEach((e) => { if (e.isIntersecting) markSpy(e.target.id); }),
          { rootMargin: "-15% 0px -75% 0px" },
        );
        tocSections.forEach((s) => {
          s.style.scrollMarginTop = "3rem";
          spy.observe(s);
        });
        // The spy alone never reaches a short final section; the page end does.
        addEventListener("scroll", () => {
          if (innerHeight + scrollY >= document.body.scrollHeight - 8) markSpy(tocSections[tocSections.length - 1].id);
        }, { passive: true });
        markSpy(tocSections[0].id);
      }

      // Syntax highlighting, loaded only when the page has code excerpts.
      // Hand-colored terminal output stays a bare <pre> with spans; real code
      // is <pre><code class="language-x"> and gets highlighted here.
      if (document.querySelector("pre code")) {
        const hl = document.createElement("script");
        hl.src = "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js";
        hl.onload = () => window.hljs && window.hljs.highlightAll();
        document.head.appendChild(hl);
      }

      // A Copy button and a Wrap toggle on every <pre>. Block-scoped so the
      // names cannot collide with a page script in the same global scope.
      {
        const surfaceLuma = (el) => {
          const rgb = getComputedStyle(el).backgroundColor.match(/[\d.]+/g);
          if (!rgb || Number(rgb[3] ?? 1) === 0) return null;
          return (Number(rgb[0]) * 299 + Number(rgb[1]) * 587 + Number(rgb[2]) * 114) / 1000;
        };
        const writeClipboard = async (text) => {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch {
            // Not every engine grants the clipboard API on file://.
            const ta = document.body.appendChild(document.createElement("textarea"));
            ta.value = text;
            ta.style.cssText = "position:fixed;top:0;opacity:0";
            ta.select();
            const ok = document.execCommand("copy");
            ta.remove();
            return ok;
          }
        };
        for (const pre of document.querySelectorAll("main pre")) {
          // The padded dark surface is a wrapping div in the terminal dialect
          // and the pre itself in the code-excerpt one. Decorate whichever.
          const parent = pre.parentElement;
          const surface =
            parent.tagName === "DIV" && parent.childElementCount === 1 && surfaceLuma(parent) !== null ? parent : pre;
          const block = document.createElement("div");
          block.setAttribute("data-code-block", "");
          block.dataset.surface = (surfaceLuma(surface) ?? 255) < 128 ? "dark" : "light";
          block.dataset.wrap = pre.dataset.wrap === "off" ? "off" : "on";
          // Grid and flex placement is the outer box's job once there is one.
          const placement = [...surface.classList].filter((c) => /(^|:)(col-|row-|self-|order-|shrink|grow|basis-)/.test(c));
          surface.classList.remove(...placement);
          block.classList.add(...placement);
          surface.replaceWith(block);
          block.append(surface);

          const tools = document.createElement("div");
          tools.setAttribute("data-code-tools", "");
          tools.innerHTML =
            "<button type='button' title='Wrap long lines'><i class='ph ph-arrow-u-down-left'></i>Wrap</button>" +
            "<button type='button' title='Copy to clipboard'><i class='ph ph-copy'></i>Copy</button>";
          block.append(tools);

          const wrapBtn = tools.firstElementChild;
          wrapBtn.setAttribute("aria-pressed", String(block.dataset.wrap === "on"));
          wrapBtn.addEventListener("click", () => {
            const on = block.dataset.wrap !== "on";
            block.dataset.wrap = on ? "on" : "off";
            wrapBtn.setAttribute("aria-pressed", String(on));
          });

          const copyBtn = tools.lastElementChild;
          let settle;
          copyBtn.addEventListener("click", async () => {
            const ok = await writeClipboard(pre.textContent.replace(/\s+$/, ""));
            copyBtn.innerHTML = ok
              ? "<i class='ph ph-check'></i>Copied"
              : "<i class='ph ph-warning'></i>Failed";
            clearTimeout(settle);
            settle = setTimeout(() => {
              copyBtn.innerHTML = "<i class='ph ph-copy'></i>Copy";
            }, 1600);
          });
        }
      }
    </script>
  </body>
</html>
